# 项目信息与依赖声明；uv.lock 由 uv 生成，保存实际解析的版本。
[project]
name = "ZhiChengApp"
version = "0.1.0"
description = "知成：面向 IT 职业培训的知识库与 AI 助教"
# 当前应用和锁文件只针对 Python 3.12 验证。
requires-python = ">=3.12,<3.13"

# 正式代码直接使用的库；不能因为某个库也被其他依赖安装就省略声明。
dependencies = [
    # Web 接口、启动服务、请求校验及 .env 配置读取。
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",  # app.py 直接使用其 HTTPException。
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",  # scripts.configure_local 生成本地配置。
    "python-multipart>=0.0.20,<1",  # FastAPI 解析文件上传和表单。
    # MongoDB 元数据、Milvus 向量、MinIO 原文件与连接池。
    "pymongo>=4.10,<5",
    "pymilvus>=2.5.16,<2.6",
    "minio>=7.2,<8",
    "urllib3>=2,<3",
    # Markdown、Word 解析。
    "markdown-it-py>=3,<5",
    "python-docx>=1.2,<2",
    # 导入/问答流程、模型调用及响应解析；httpx 也用于脚本和测试。
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-core>=1,<2",
    "openai>=2,<4",  # 目录识别需要捕获 SDK 的连接和超时异常。
    "httpx>=0.28,<1",
    "omml2latex==0.1.1",
]

# 可选本地向量/重排模型：uv sync --extra local-models。
# transformers 只在 LocalModels._load 中使用，与模型依赖放在同一组。
[project.optional-dependencies]
local-models = [
    "FlagEmbedding>=1.3.5,<2",
    "transformers>=4.51,<5",
    "torch==2.14.0",
]

# 开发工具：pytest 跑测试，ruff 检查代码，mongomock 模拟 MongoDB。
# uv sync 默认安装 dev 组；部署时可用 --no-dev 排除。
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mongomock>=4.3,<5"]

[tool.uv]
# 直接从源码启动应用，不将此仓库构建成可安装的 Python 包。
package = false
# 当前交付目标为 Windows x64；不要误以为这个锁文件覆盖 Linux/macOS。
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

# torch 使用指定的 CUDA 13.2 wheel 源；运行设备仍由 .env 配置。
[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true  # 仅为显式指定此源的包查找版本。

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["output", "logs"]  # 生成数据和日志不参与代码检查。

[tool.ruff.lint]
# 常规错误、未定义/未使用名称、导入排序、语法升级、常见缺陷、异步误用。
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# Depends 是 FastAPI 声明依赖的常规写法，允许其出现在参数默认值中。
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # 默认只收集 tests 下的 test_*.py。
pythonpath = ["."]  # 测试可直接导入根目录下的 app、services 等模块。
