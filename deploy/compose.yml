name: zhichengapp

services:
  etcd:
    image: ${ZHICHENGAPP_ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.25}
    pull_policy: missing
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: ${ZHICHENGAPP_MINIO_IMAGE:-milvusdb/minio:RELEASE.2024-12-18T13-15-44Z}
    pull_policy: missing
    environment:
      MINIO_ROOT_USER: ${ZHICHENGAPP_MINIO_ACCESS_KEY:?Run scripts.configure_local first}
      MINIO_ROOT_PASSWORD: ${ZHICHENGAPP_MINIO_SECRET_KEY:?Run scripts.configure_local first}
    command: minio server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9000/minio/health/live || mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  milvus:
    image: ${ZHICHENGAPP_MILVUS_IMAGE:-milvusdb/milvus:v2.5.5}
    pull_policy: missing
    command: [milvus, run, standalone]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${ZHICHENGAPP_MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${ZHICHENGAPP_MINIO_SECRET_KEY}
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${ZHICHENGAPP_MILVUS_PASSWORD}
      MQ_TYPE: rocksmq
    ports:
      - "127.0.0.1:19531:19530"
      - "127.0.0.1:9092:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mongo:
    image: ${ZHICHENGAPP_MONGO_IMAGE:-mongo:7.0}
    pull_policy: missing
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${ZHICHENGAPP_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${ZHICHENGAPP_MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  mongo_data:
